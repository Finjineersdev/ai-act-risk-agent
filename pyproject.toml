[project]
name = "riskagent"
version = "1.3.0"
description = "Classify an AI system under the EU AI Act, with every step backed by a checked quote."
readme = "README.md"
authors = [{ name = "Haseeb Hanif" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "actrag",
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Repository = "https://github.com/Finjineersdev/ai-act-risk-agent"
Demo = "https://ai-act-risk-agent-v1-2-0.onrender.com"

[build-system]
requires = ["uv_build>=0.12.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
actrag = { url = "https://github.com/Finjineersdev/eu-ai-act-rag/archive/refs/tags/v1.3.0.tar.gz" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# imports, bugbear, pyupgrade, simplify, and bandit's security rules
extend-select = ["I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks
