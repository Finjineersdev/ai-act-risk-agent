name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t riskagent .
      - name: Embedder loads offline and search works
        run: >
          docker run --rm --network none riskagent /app/.venv/bin/python -c
          "from actrag.retrieve import Retriever; r = Retriever.load();
          assert r.search('biometric identification', k=1)"
      - run: docker run -d -p 8000:8000 --name riskagent riskagent
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 2; done
          docker logs riskagent; exit 1
